<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぶらり散歩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   設定: 公開するときは、ここにGoogle MapsのAPIキーを入れてください。
   空のままだと、起動画面でキーを入力する形になります。
   ============================================================ */
:root{
  --ink:#1d2a24;
  --paper:#f3efe4;
  --moss:#3f6b52;
  --moss-deep:#2c4d3b;
  --lantern:#e9a23b;
  --glass:rgba(22,32,27,.72);
  --glass-line:rgba(255,255,255,.14);
  --on-glass:#f3efe4;
  --muted:#b9c2b8;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--on-glass);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  overflow:hidden;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

/* ---------- 起動画面 ---------- */
#start{
  position:fixed;inset:0;display:grid;place-items:center;
  padding:24px 16px;
  background:
    radial-gradient(120% 80% at 80% 0%, rgba(233,162,59,.18), transparent 60%),
    linear-gradient(180deg,#22372c,#16211b);
  z-index:20;overflow:auto;
}
.card{width:100%;max-width:440px;display:grid;gap:20px}
.brand{display:grid;gap:6px}
.brand small{letter-spacing:.2em;color:var(--lantern);font-size:12px}
.brand h1{margin:0;font-size:clamp(40px,11vw,56px);font-weight:900;line-height:1;letter-spacing:.02em}
.brand p{margin:4px 0 0;color:var(--muted);line-height:1.8;font-size:15px}
.field{display:grid;gap:8px}
.field label{font-size:13px;color:var(--muted);letter-spacing:.06em}
.field select,.field input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--glass-line);
  background:rgba(255,255,255,.06);color:var(--on-glass);font:inherit;font-size:16px;
}
.field select option{color:#111}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
.go{
  padding:14px 18px;border:0;border-radius:999px;background:var(--lantern);color:#2a1c05;
  font-weight:900;font-size:18px;letter-spacing:.08em;
}
.go:disabled{opacity:.5;cursor:wait}
.err{color:#ffb4a2;font-size:13px;line-height:1.7;margin:0}

/* ---------- 散歩画面 ---------- */
#panoWrap{position:fixed;inset:0}
#pano{width:100%;height:100%}
.hud{
  position:fixed;z-index:5;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;
}
#stats{
  top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:10px 14px;
  display:grid;grid-template-columns:repeat(4,auto);gap:4px 16px;
}
#stats .k{font-size:11px;color:var(--muted);letter-spacing:.08em}
#stats .v{font-size:18px}
#place{
  top:calc(12px + env(safe-area-inset-top,0px));right:12px;max-width:min(46vw,320px);
  padding:10px 14px;font-size:13px;line-height:1.5;color:var(--on-glass);
}
#place:empty{display:none}
#bar{
  left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100% - 24px);
}
#bar button{
  border:0;border-radius:12px;padding:10px 14px;background:transparent;color:var(--on-glass);
  font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;
}
#bar button:hover{background:rgba(255,255,255,.08)}
#bar button[aria-pressed="true"]{background:var(--lantern);color:#2a1c05}
#bar svg{width:18px;height:18px;flex:none}

#mapbox{
  right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:min(300px,calc(100vw - 24px));height:220px;overflow:hidden;padding:0;
}
#minimap{width:100%;height:100%}

#log{
  left:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:min(320px,calc(100vw - 24px));max-height:46vh;overflow:auto;padding:12px 14px;
}
#log h2{margin:0 0 8px;font-size:14px;letter-spacing:.08em;color:var(--lantern)}
#log ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#log li button{
  width:100%;text-align:left;border:1px solid var(--glass-line);border-radius:10px;
  background:rgba(255,255,255,.04);color:var(--on-glass);padding:8px 10px;
  display:grid;gap:2px;font-size:13px;
}
#log li small{color:var(--muted);font-size:11px}
#log .empty{color:var(--muted);font-size:13px;margin:0}

/* キャラ選び */
.field .lbl{font-size:13px;color:var(--muted);letter-spacing:.06em}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{display:grid;justify-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(255,255,255,.05);color:var(--on-glass);font-weight:700;font-size:13px}
.chip svg{width:52px;height:52px}
.chip[aria-pressed="true"]{border-color:var(--lantern);background:rgba(233,162,59,.18)}
#hiro.gallop.walking .leg-l,#hiro.gallop.walking .leg-r{animation-duration:.34s}
#hiro.gallop.walking .leg-r{animation-delay:-.17s}
#hiro.gallop.walking .figure{animation:bob .17s ease-in-out infinite alternate}
#hiro.gallop.walking .hair-tips{animation-duration:.34s}
#goBox{
  left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:min(420px,calc(100vw - 24px));padding:12px 14px;display:grid;gap:8px;z-index:7;
}
#goBox label{font-size:12px;color:var(--muted);letter-spacing:.06em}
#goBox .row{display:flex;gap:8px}
#goBox input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--glass-line);background:rgba(255,255,255,.08);color:var(--on-glass);font:inherit;font-size:16px}
#goBox button{border:0;border-radius:10px;padding:0 16px;background:var(--lantern);color:#2a1c05;font-weight:900}
#goBox .err{margin:0}
#toast{
  position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--moss);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:700;
  font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;
}
#toast.show{opacity:1}

@media (max-width:560px){
  #place{top:calc(78px + env(safe-area-inset-top,0px));right:auto;left:12px;max-width:calc(100% - 24px);padding:5px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .5s} #place.fade{opacity:0;pointer-events:none}
  #bar button span{display:none}
  #bar button{padding:12px}
  #mapbox,#log{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){/* キャラ選び */
.field .lbl{font-size:13px;color:var(--muted);letter-spacing:.06em}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{display:grid;justify-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(255,255,255,.05);color:var(--on-glass);font-weight:700;font-size:13px}
.chip svg{width:52px;height:52px}
.chip[aria-pressed="true"]{border-color:var(--lantern);background:rgba(233,162,59,.18)}
#hiro.gallop.walking .leg-l,#hiro.gallop.walking .leg-r{animation-duration:.34s}
#hiro.gallop.walking .leg-r{animation-delay:-.17s}
#hiro.gallop.walking .figure{animation:bob .17s ease-in-out infinite alternate}
#hiro.gallop.walking .hair-tips{animation-duration:.34s}
#goBox{
  left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:min(420px,calc(100vw - 24px));padding:12px 14px;display:grid;gap:8px;z-index:7;
}
#goBox label{font-size:12px;color:var(--muted);letter-spacing:.06em}
#goBox .row{display:flex;gap:8px}
#goBox input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--glass-line);background:rgba(255,255,255,.08);color:var(--on-glass);font:inherit;font-size:16px}
#goBox button{border:0;border-radius:10px;padding:0 16px;background:var(--lantern);color:#2a1c05;font-weight:900}
#goBox .err{margin:0}
#toast{transition:none}}
/* ---------- ひろ ---------- */
#hiro{
  position:fixed;z-index:4;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  height:min(30vh,240px);aspect-ratio:120/200;max-width:100%;
  pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
}
#hiro svg{width:100%;height:100%;overflow:visible}
#hiro .part{transform-box:fill-box}
#hiro .leg{transform-origin:50% 0}
#hiro .arm{transform-origin:50% 8%}
#hiro .figure{animation:breathe 3.2s ease-in-out infinite}
#hiro .hair-tips{transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
#hiro.walking .figure{animation:bob .32s ease-in-out infinite alternate}
#hiro.walking .leg-l{animation:step .64s ease-in-out infinite}
#hiro.walking .leg-r{animation:step .64s ease-in-out infinite -.32s}
#hiro.walking .arm-l{animation:swing .64s ease-in-out infinite}
#hiro.walking .arm-r{animation:swing .64s ease-in-out infinite -.32s}
#hiro.walking .hair-tips{animation:sway .64s ease-in-out infinite}
#hiro .shadow{transform-origin:50% 50%}
#hiro.walking .shadow{animation:shadow .32s ease-in-out infinite alternate}
@keyframes step{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-7px) scaleY(.93)}}
@keyframes swing{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes sway{0%,100%{transform:rotate(1.2deg)}50%{transform:rotate(-1.2deg)}}
@keyframes shadow{from{transform:scaleX(1)}to{transform:scaleX(.92)}}
#hiro .back,#hiro .front{height:100%}
#hiro .front{display:none}
#hiro.facing .front{display:block}
#hiro.facing .back{display:none}
#hiro.facing .rear{display:none}
#flash{position:fixed;inset:0;background:#fff;z-index:40;pointer-events:none;opacity:0}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.go{animation:none}}
#hiro .scooter{display:none}
#hiro.riding .scooter{display:inline}
#hiro.riding .leg,#hiro.riding .arm,#hiro.riding .hair-tips{animation:none!important}
#hiro.riding .arm-l{transform:rotate(22deg) scaleY(.82)}
#hiro.riding .arm-r{transform:rotate(-22deg) scaleY(.82)}
#hiro.riding .figure{animation:none}
#hiro.riding.walking .figure{animation:ride .14s linear infinite alternate}
#hiro.riding.walking .shadow{animation:none}
@keyframes ride{from{transform:translateY(0)}to{transform:translateY(-1.2px)}}
@media (prefers-reduced-motion:reduce){#hiro *{animation:none!important}}
#say{
  position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:calc(78px + min(30vh,240px) + 6px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);
  background:var(--paper);color:var(--ink);border-radius:18px;padding:8px 16px 8px 8px;
  box-shadow:0 6px 18px rgba(0,0,0,.3);font-weight:700;font-size:15px;line-height:1.5;
  animation:pop .25s ease-out;
}
#say::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--paper)}
#say .face{width:44px;height:44px;flex:none}
#say p{margin:0}
#say.event{background:var(--lantern);color:#2a1c05}
#say.event::after{border-top-color:var(--lantern)}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#log h3{margin:14px 0 8px;font-size:13px;letter-spacing:.08em;color:var(--lantern)}
#souvList li{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--glass-line);display:flex;justify-content:space-between;gap:8px}
#souvList li small{color:var(--muted);font-size:11px;white-space:nowrap}
@media (max-width:560px){#say{bottom:calc(70px + min(24vh,190px) + 6px + env(safe-area-inset-bottom,0px));font-size:14px}}
@media (prefers-reduced-motion:reduce){#say{animation:none}}
@media (max-width:560px){#hiro{height:min(24vh,190px);bottom:calc(70px + env(safe-area-inset-bottom,0px))}}

</style>
</head>
<body>

<!-- 起動画面 -->
<section id="start">
  <div class="card">
    <div class="brand">
      <small>STREET VIEW STROLL</small>
      <h1>ぶらり散歩</h1>
      <p>好きなキャラと一緒に、本物の街並みをぶらぶら。<br>つぶやいたり、寄り道したり、おみやげが増えたり。</p>
    </div>

    <div class="field">
      <span class="lbl">だれと行く？</span>
      <div class="chars" id="chars"></div>
    </div>
    <div class="field">
      <label for="addr">どこへ行く？（住所や場所の名前）</label>
      <input id="addr" type="text" autocomplete="off" placeholder="例：東京都台東区浅草2-3-1、京都駅">
    </div>
    <div class="field">
      <label for="city">または、おすすめの街から選ぶ</label>
      <select id="city"></select>
    </div>

    <div class="field" id="keyField">
      <label for="apikey">Google Maps APIキー</label>
      <input id="apikey" type="password" autocomplete="off" placeholder="AIza...">
      <p class="hint">キーはこのページを閉じると消えます。公開するときはHTML内の API_KEY に書き込んでください。</p>
    </div>

    <button class="go" id="goBtn">歩きはじめる</button>
    <p class="err" id="err" hidden></p>
  </div>
</section>

<!-- 散歩画面 -->
<div id="panoWrap"><div id="pano"></div></div>

<div class="hud" id="stats" hidden>
  <div><div class="k">歩いた距離</div><div class="v num" id="sDist">0 m</div></div>
  <div><div class="k">歩数</div><div class="v num" id="sSteps">0</div></div>
  <div><div class="k">おみやげ</div><div class="v num" id="sSouv">0</div></div>
  <div><div class="k">時間</div><div class="v num" id="sTime">0:00</div></div>
</div>
<div class="hud" id="place" hidden></div>

<form class="hud" id="goBox" hidden>
  <label for="goAddr">次の行き先（住所や場所の名前）</label>
  <div class="row"><input id="goAddr" type="text" autocomplete="off" placeholder="例：東京タワー"><button type="submit">行く</button></div>
  <p class="err" id="goErr" hidden></p>
</form>
<div class="hud" id="mapbox" hidden><div id="minimap"></div></div>

<div class="hud" id="log" hidden>
  <h2>撮った景色</h2>
  <p class="empty" id="logEmpty">気になる景色で「記録」を押すと、ここに残ります。</p>
  <ol id="logList"></ol>
  <h3>おみやげ・できごと</h3>
  <p class="empty" id="souvEmpty">歩いていると、いろんなことが起きます。</p>
  <ol id="souvList"></ol>
</div>

<nav class="hud" id="bar" hidden>
  <button id="autoBtn" aria-pressed="false" title="おまかせで歩く">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l2-6 3 3v4M7 12l3-4 4 1 3 4M11 15l-1-5"/></svg>
    <span id="autoLabel">おまかせ</span>
  </button>
  <button id="rideBtn" aria-pressed="true" title="電動キックボードに乗る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 18h9M16 18L13 4h3"/></svg>
    <span id="rideLabel">降りる</span>
  </button>
  <button id="snapBtn" title="この場所を記録">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>記録</span>
  </button>
  <button id="logBtn" aria-pressed="false" title="見つけた場所">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5h14M5 12h14M5 19h9"/></svg>
    <span>思い出</span>
  </button>
  <button id="mapBtn" aria-pressed="false" title="地図">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14M15 6v14"/></svg>
    <span>地図</span>
  </button>
  <button id="destBtn" aria-pressed="false" title="住所で行き先を選ぶ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
    <span>行き先</span>
  </button>
  <button id="warpBtn" title="この街の別の場所へ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
    <span>ワープ</span>
  </button>
</nav>


<!-- 歩く人(後ろ姿) -->
<div id="hiro" class="riding" hidden aria-label="前を進むわたし">
<svg viewBox="0 0 120 200" role="img">
  <defs>
    <pattern id="stripe" width="7" height="10" patternUnits="userSpaceOnUse">
      <rect width="7" height="10" fill="#1f3d6e"/><rect width="1.8" height="10" fill="#dfe7f2"/>
    </pattern>
  </defs>
  <ellipse class="part shadow" cx="60" cy="198" rx="30" ry="5.5" fill="rgba(0,0,0,.35)"/>
  <g class="figure">
    <!-- 電動キックボード(乗っているときだけ表示) -->
    <g class="scooter">
      <rect x="8" y="121" width="104" height="6" rx="3" fill="#2c2f36"/>
      <rect x="3" y="118" width="17" height="12" rx="6" fill="#111215"/>
      <rect x="100" y="118" width="17" height="12" rx="6" fill="#111215"/>
      <rect x="51" y="186" width="18" height="20" rx="8" fill="#111215"/>
      <rect x="55" y="190" width="10" height="12" rx="4" fill="#3a3d44"/>
      <path d="M44 190 C46 178 74 178 76 190 Z" fill="#e9a23b"/>
      <rect x="22" y="182" width="76" height="9" rx="4.5" fill="#e9a23b"/>
      <rect x="22" y="188" width="76" height="3" rx="1.5" fill="#b87a1f"/>
      <rect x="53" y="192" width="14" height="4" rx="2" fill="#ff4d3d"/>
    </g>
    <g class="part leg leg-l">
      <rect x="45" y="140" width="13" height="38" rx="6" fill="#f0cfb6"/>
      <rect x="45" y="140" width="4" height="38" rx="2" fill="#e2b99c"/>
      <rect x="41" y="172" width="20" height="13" rx="6" fill="#26262a"/>
      <rect x="42" y="181" width="18" height="4" rx="2" fill="#e8e4da"/>
    </g>
    <g class="part leg leg-r">
      <rect x="62" y="140" width="13" height="38" rx="6" fill="#f0cfb6"/>
      <rect x="71" y="140" width="4" height="38" rx="2" fill="#e2b99c"/>
      <rect x="59" y="172" width="20" height="13" rx="6" fill="#26262a"/>
      <rect x="60" y="181" width="18" height="4" rx="2" fill="#e8e4da"/>
    </g>
    <g class="part arm arm-l">
      <rect x="26" y="96" width="11" height="40" rx="5.5" fill="#f0cfb6"/>
      <rect x="23" y="84" width="16" height="22" rx="7" fill="url(#stripe)" stroke="#16305a" stroke-width="1"/>
      <circle cx="31.5" cy="137" r="6" fill="#f0cfb6"/>
    </g>

    const m = String(e && (e.code || e.message) || e);

let char = CHARS[0];
const ANIMAL_HAPPEN = [
  {t:"なでてもらった", s:"なでなで、うれしい"},
  {t:"子どもに手を振られた", s:"あ、手を振ってくれた！"},
  {t:"水を飲んでひと休み", s:"ごくごく。ふう"},
  {t:"写真を撮られた", s:"撮られちゃった。いい顔できたかな"},
  {t:"ほかの動物に会った", s:"あ、おともだち？"},
  {t:"日かげで休んだ", s:"ちょっとだけ休憩"}
];
function setupChars(){
  CHARS[0].svg = $("hiro").innerHTML;
  CHARS[0].face = $("say").querySelector(".face").innerHTML;
  const box = $("chars");
  CHARS.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", c === char);
    b.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${c.face}</svg><span>${c.name}</span>`;
    b.addEventListener("click", () => { char = c; [...box.children].forEach(x => x.setAttribute("aria-pressed", x === b)); });
    box.appendChild(b);
  });
}
function applyChar(){
  const h = $("hiro");
  const faceNoBg = char.face.replace(/<circle cx="50" cy="50" r="50"[^>]*?(\/>|><\/circle>)/, "");
  const cut = char.svg.lastIndexOf("</g>");
  const front = char.svg.slice(0, cut) + `<g transform="${char.head}">${faceNoBg}</g>` + char.svg.slice(cut);
  const frontU = front.replace(/stripeF/g, "stripeFB").replace(/"stripe"/g, '"stripeB"').replace(/#stripe\)/g, "#stripeB)");
  h.innerHTML = `<div class="back">${char.svg}</div><div class="front">${frontU}</div>`;
  h.className = "";
  h.setAttribute("aria-label", `前を進む${char.name}`);
  $("say").querySelector(".face").innerHTML = char.face;
  riding = !!char.rideOn;
  $("rideBtn").hidden = !char.ride;
  if (char.ride) {
    $("rideLabel").textContent = riding ? char.unride : char.ride;
    $("rideBtn").setAttribute("aria-pressed", riding);
  }
  h.classList.toggle(rideClass(), riding);
}
const rideClass = () => char.id === "horse" ? "gallop" : "riding";

let sinceTalk = 0, nextTalk = 120, sinceEvent = 0, nextEvent = 300, souvenirs = [], sayT, idleT;
const rand = a => a[Math.floor(Math.random() * a.length)];
const local = () => LOCAL[Object.keys(LOCAL).find(k => city.name.includes(k))] || { talk: [], souv: [] };
const shortName = () => city.label || city.name.split("・").pop();

function say(text, isEvent){
  const b = $("say");
  $("sayText").textContent = text;
  b.classList.toggle("event", !!isEvent);
  b.hidden = true; void b.offsetWidth; b.hidden = false;
  clearTimeout(sayT); sayT = setTimeout(() => b.hidden = true, isEvent ? 5200 : 3800);
}
function chatter(d){
  sinceTalk += d; sinceEvent += d;
  resetIdle();
  if (sinceEvent >= nextEvent) { sinceEvent = 0; nextEvent = 250 + Math.random() * 250; happen(); return; }
  if (sinceTalk >= nextTalk) {
    sinceTalk = 0; nextTalk = 80 + Math.random() * 120;
    const r = Math.random();
    const pool = riding && char.rideTalk && r < .45 ? char.rideTalk : (char.talk.length && r < .6 ? char.talk : (r < .8 && local().talk.length ? local().talk : TALK));
    say(rand(pool));
  }
}
function happen(){
  let item;
  if (Math.random() < .5 && local().souv.length) {
    const g = rand(local().souv);
    item = { t: `${g}を${char.got}`, s: char.gotSay(g) };
  } else item = rand(char.id === "me" ? HAPPENINGS : ANIMAL_HAPPEN);
  souvenirs.unshift({ t: item.t, where: shortName(), at: $("sDist").textContent });
  $("sSouv").textContent = souvenirs.length;
  renderSouv();
  say(item.s, true);
}
function renderSouv(){
  $("souvEmpty").hidden = souvenirs.length > 0;
  const ol = $("souvList"); ol.innerHTML = "";
  souvenirs.forEach(x => {
    const li = document.createElement("li"), a = document.createElement("span"), b = document.createElement("small");
    a.textContent = x.t; b.textContent = `${x.where} · ${x.at}`; b.className = "num";
    li.append(a, b); ol.appendChild(li);
  });
}
function resetIdle(){
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (!autoTimer) say(rand(char.idle)); resetIdle(); }, 25000);
}

let hiroT, faceT;
function hiroWalk(){
  const h = $("hiro"); h.classList.add("walking");
  clearTimeout(hiroT);
  hiroT = setTimeout(() => { if (!autoTimer) h.classList.remove("walking"); }, 1300);
}

function tick(){
  const s = Math.floor((Date.now() - startTime) / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  $("sTime").textContent = h ? `${h}:${String(m).padStart(2,"0")}:${sec}` : `${m}:${sec}`;
}

// 指定地点の近くのストリートビューへ移動
function jumpTo(latLng, radius){
  return new Promise(resolve => {
    svService.getPanorama({
      location: latLng, radius,
      source: google.maps.StreetViewSource.OUTDOOR,
      preference: google.maps.StreetViewPreference.NEAREST
    }, (data, status) => {
      if (status === "OK") {
        warping = true;
        pano.setPano(data.location.pano);
        pano.setPov({ heading: Math.random() * 360, pitch: 0 });
        pano.setVisible(true);
        resolve(true);
      } else resolve(false);
    });
  });
}

// 今いる街の中のランダムな地点へ
async function warp(first){
  const center = new google.maps.LatLng(city.lat, city.lng);
  for (let i = 0; i < 8; i++) {
    const pt = first && i === 0 ? center :
      google.maps.geometry.spherical.computeOffset(center, Math.sqrt(Math.random()) * city.r, Math.random() * 360);
    if (await jumpTo(pt, first ? 300 : 150)) {
      if (!first) { toast(`${city.name} のどこかへ`); say(rand(["わっ！ここどこ？","瞬間移動しちゃった","あれ、景色が変わった"])); }
      return true;
    }
  }
  return false;
}

// おまかせ散歩: なるべく前を向いたまま、ときどき曲がる
function autoStep(){
  const links = pano.getLinks() || [];
  if (!links.length) { warp(false); return; }
  const cur = pano.getPov().heading;
  const diff = h => { const d = Math.abs(((h - cur) % 360 + 540) % 360 - 180); return d; };
  const sorted = [...links].sort((a, b) => diff(a.heading) - diff(b.heading));
  let next = sorted[0];
  const turns = sorted.filter(l => diff(l.heading) > 20 && diff(l.heading) < 120);
  if (turns.length && Math.random() < 0.18) next = turns[Math.floor(Math.random() * turns.length)];
  if (diff(next.heading) > 150 && sorted.length > 1 && Math.random() < 0.7) next = sorted[1];
  pano.setPano(next.pano);
  smoothTurn(cur, next.heading);
}
function smoothTurn(from, to){
  const delta = ((to - from) % 360 + 540) % 360 - 180;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { pano.setPov({ heading: to, pitch: 0 }); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
    pano.setPov({ heading: from + delta * e, pitch: 0 });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

$("autoBtn").addEventListener("click", () => {
  const on = !autoTimer;
  $("autoBtn").setAttribute("aria-pressed", on);
  $("autoLabel").textContent = on ? "とめる" : "おまかせ";
  if (on) { autoStep(); autoTimer = setInterval(autoStep, autoInterval()); $("hiro").classList.add("walking"); }
  else { clearInterval(autoTimer); autoTimer = null; $("hiro").classList.remove("walking"); }
});

function autoInterval(){ return riding ? 2600 : 4500; }
$("rideBtn").addEventListener("click", () => {
  riding = !riding;
  $("rideBtn").setAttribute("aria-pressed", riding);
  $("rideLabel").textContent = riding ? char.unride : char.ride;
  $("hiro").classList.toggle(rideClass(), riding);
  say(char.rideSay[riding ? 0 : 1]);
  if (autoTimer) { clearInterval(autoTimer); autoTimer = setInterval(autoStep, autoInterval()); }
});

$("destBtn").addEventListener("click", () => {
  const box = $("goBox"), on = box.hidden;
  box.hidden = !on; $("destBtn").setAttribute("aria-pressed", on);
  if (on) { $("goErr").hidden = true; $("goAddr").focus(); }
});
$("goBox").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("goAddr").value.trim(); if (!q) return;
  $("goErr").hidden = true;
  try {
    const next = await geocode(q);
    const prev = city; city = next;
    if (await warp(true)) {
      $("goBox").hidden = true; $("destBtn").setAttribute("aria-pressed", false); $("goAddr").value = "";
      setTimeout(() => say(`${q}に着いた！`), 600);
    } else { city = prev; throw new Error("その近くにはストリートビューがありませんでした。"); }
  } catch (err) { $("goErr").textContent = err.message; $("goErr").hidden = false; }
});

$("warpBtn").addEventListener("click", () => warp(false));

$("mapBtn").addEventListener("click", () => {
  const box = $("mapbox"), on = box.hidden;
  box.hidden = !on; $("mapBtn").setAttribute("aria-pressed", on);
  if (on) { google.maps.event.trigger(minimap, "resize"); minimap.setCenter(pano.getPosition()); }
});

$("logBtn").addEventListener("click", () => {
  const box = $("log"), on = box.hidden;
  box.hidden = !on; $("logBtn").setAttribute("aria-pressed", on);
});

$("snapBtn").addEventListener("click", () => {
  const p = pano.getPosition(); if (!p) return;
  const item = {
    pano: pano.getPano(), pov: pano.getPov(),
    title: pano.getLocation()?.description || `${city.name} のどこか`,
    at: $("sDist").textContent, time: $("sTime").textContent
  };
  logItems.unshift(item);
  renderLog();
  const h = $("hiro");
  h.classList.add("facing");
  say(rand(char.cheese));
  clearTimeout(faceT);
  setTimeout(() => { const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); toast("記録しました"); }, 900);
  faceT = setTimeout(() => h.classList.remove("facing"), 3200);
});

function renderLog(){
  $("logEmpty").hidden = logItems.length > 0;
  const ol = $("logList"); ol.innerHTML = "";
  logItems.forEach(it => {
    const li = document.createElement("li"), b = document.createElement("button");
    const t = document.createElement("span"), s = document.createElement("small");
    t.textContent = it.title;
    s.textContent = `${it.at} 歩いたところ · ${it.time}`;
    s.className = "num";
    b.append(t, s);
    b.addEventListener("click", () => { warping = true; pano.setPano(it.pano); pano.setPov(it.pov); });
    li.appendChild(b); ol.appendChild(li);
  });
}

let toastT;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
}
setupChars();
